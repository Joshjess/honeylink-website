    - generic [ref=e22]:
      - img "HoneyLink team aan het werk" [ref=e24]
      - generic [ref=e25]:
        - heading "Ons doel is om jouw manier van werken efficienter te maken." [level=2] [ref=e26]
        - paragraph [ref=e27]: HoneyLink is de specialist in digitale procesautomatisering voor de ondernemer of afdelingsmanager. Zie jij kansen binnen jouw werk? dan is HoneyLink de juiste partij. Onze missie is zorgen voor meer werkplezier door processen efficienter in te richten.
        - paragraph [ref=e28]: Dat doen wij door complexe processen te vereenvoudigen en te automatiseren. De recente ontwikkelingen op het gebied van AI hebben de mogelijkheden exponentieel vergroot. We nemen je mee in de wereld van innovatieve technologieen en zorgen voor een implementatieplan afgestemd op jouw specifieke behoeften.
        - paragraph [ref=e29]: "Zo kun jij je bevrijden van deze slaapverwekkende, routinematige taken die veel tijd kosten. Je kan je weer focussen op waar het echt om draait: ondernemen."
        - paragraph [ref=e30]: Dit is waar HoneyLink het verschil maakt. Ons developmentteam staat klaar om met jouw ideeen aan de slag te gaan. Geen uitdaging gaan wij uit de weg.
        - paragraph [ref=e31]: Onze missie is om zoveel mogelijk 'saaie' en repetitieve taken te automatiseren, daardoor het werk leuker te maken en jouw bedrijf efficienter
    - generic [ref=e33]:
      - heading "De bezige bijen van HoneyLink" [level=2] [ref=e34]
      - generic [ref=e35]:
        - generic [ref=e36]:
          - img "Joshua Offermans" [ref=e37]
          - paragraph [ref=e38]: Joshua Offermans
