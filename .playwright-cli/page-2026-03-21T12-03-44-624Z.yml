    - generic [ref=e45]:
      - heading "Veelgestelde vragen" [level=2] [ref=e46]
      - generic [ref=e47]:
        - button "Wat zijn praktische voorbeelden van diensten die HoneyLink aanbiedt?" [ref=e48]:
          - generic [ref=e49]: Wat zijn praktische voorbeelden van diensten die HoneyLink aanbiedt?
          - img [ref=e50]
        - region:
          - paragraph [ref=e52]: "Een automation kan je efficienter laten werken door het vereenvoudigen van administratie en het verbinden van je systemen. Zo kan een ingevuld contactformulier automatisch een klantrecord aanmaken in je CRM, een API-koppeling tussen je webshop en boekhoudsysteem zorgt dat facturen direct worden verwerkt en klanten ontvangen automatisch een follow-up e-mail. Een chatbot transformeert je klantenservice door 24/7 beschikbaar te zijn voor vragen en ondersteuning. Op maat getraind voor jouw bedrijf, kan de chatbot productadvies geven, bestellingen opvolgen, veelgestelde vragen beantwoorden en klanten ontzorgen bij routinematige problemen. Dit bespaart niet alleen tijd voor je team, maar zorgt ook voor consistente antwoorden en hogere klanttevredenheid. Bijvoorbeeld voor productdocumentatie: in plaats van handleidingen die niemand leest, biedt een chatbot interactieve hulp, precies wanneer je klanten het nodig hebben. Een AI-agent helpt bij personeelsplanning (zoals voor een restaurant): analyseer drukke dagen, check beschikbaarheid van personeel en stel automatisch een weekschema op. Interesse? Vraag een gratis intakegesprek aan!"
      - generic [ref=e53]:
        - button "Welke bedrijven hebben baat bij een samenwerking met HoneyLink?" [ref=e54]:
          - generic [ref=e55]: Welke bedrijven hebben baat bij een samenwerking met HoneyLink?
          - img [ref=e56]
        - region:
          - paragraph [ref=e58]: "Elk bedrijf dat repetitieve taken uitvoert, kan profiteren van automatisering. Of je nu een MKB-ondernemer bent met een webshop, een dienstverlenend bedrijf met veel klantcommunicatie, of een groeiend bedrijf dat moeite heeft om processen schaalbaar te houden -- HoneyLink helpt je verder. Denk aan e-commerce, horeca, adviesbureaus, maakbedrijven en zorginstellingen. Van kleine ondernemers tot middelgrote bedrijven: als je merkt dat je team te veel tijd kwijt is aan handmatige processen, is HoneyLink de juiste partner."
      - generic [ref=e59]:
        - button "Wat kan ik verwachten van een adviesgesprek?" [ref=e60]:
          - generic [ref=e61]: Wat kan ik verwachten van een adviesgesprek?
          - img [ref=e62]
        - region:
          - paragraph [ref=e64]: Tijdens een gratis adviesgesprek bespreken we jouw huidige werkprocessen en waar je tegenaan loopt. We kijken samen naar de mogelijkheden voor automatisering en AI binnen jouw bedrijf. Na het gesprek ontvang je een helder overzicht van de kansen en een voorstel voor de volgende stappen. Er zijn geen verplichtingen aan verbonden -- het gesprek is bedoeld om te ontdekken hoe we je het beste kunnen helpen.
      - generic [ref=e65]:
        - button "Hoe ziet de samenwerking eruit nadat ik klant ben geworden bij HoneyLink?" [ref=e66]:
          - generic [ref=e67]: Hoe ziet de samenwerking eruit nadat ik klant ben geworden bij HoneyLink?
          - img [ref=e68]
        - region:
          - paragraph [ref=e70]: Na het adviesgesprek stellen we samen een plan van aanpak op, afgestemd op jouw specifieke behoeften. Ons team gaat vervolgens aan de slag met de implementatie, waarbij we je stap voor stap meenemen in het proces. Je krijgt een vast aanspreekpunt en regelmatige updates over de voortgang. Na oplevering bieden we ondersteuning en zorgen we ervoor dat alles soepel blijft draaien. We denken ook proactief mee over verdere optimalisaties.
      - generic [ref=e71]:
        - button "Wat is een workflow automation?" [ref=e72]:
          - generic [ref=e73]: Wat is een workflow automation?
          - img [ref=e74]
        - region:
          - paragraph [ref=e76]: Een workflow automation is het automatiseren van een reeks taken die normaal handmatig worden uitgevoerd. Denk aan het automatisch verwerken van bestellingen, het versturen van herinneringsmails, of het synchroniseren van gegevens tussen verschillende systemen. Door deze processen te automatiseren bespaar je tijd, verminder je fouten en kun je je focussen op de taken die er echt toe doen. HoneyLink ontwerpt en bouwt deze workflows op maat voor jouw bedrijf.
