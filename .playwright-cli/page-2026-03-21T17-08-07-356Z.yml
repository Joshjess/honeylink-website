    - generic [ref=e88]:
      - heading "Veelgestelde vragen." [level=2] [ref=e89]
      - generic [ref=e90]:
        - button "Wat zijn praktische voorbeelden van diensten die HoneyLink aanbiedt?" [ref=e91]:
          - generic [ref=e92]: Wat zijn praktische voorbeelden van diensten die HoneyLink aanbiedt?
          - img [ref=e93]
        - region:
          - paragraph [ref=e95]: "Een automation kan je efficienter laten werken door het vereenvoudigen van administratie en het verbinden van je systemen. Zo kan een ingevuld contactformulier automatisch een klantrecord aanmaken in je CRM, een API-koppeling tussen je webshop en boekhoudsysteem zorgt dat facturen direct worden verwerkt en klanten ontvangen automatisch een follow-up e-mail. Een chatbot transformeert je klantenservice door 24/7 beschikbaar te zijn voor vragen en ondersteuning. Op maat getraind voor jouw bedrijf, kan de chatbot productadvies geven, bestellingen opvolgen, veelgestelde vragen beantwoorden en klanten ontzorgen bij routinematige problemen. Een AI-agent helpt bij personeelsplanning (zoals voor een restaurant): analyseer drukke dagen, check beschikbaarheid van personeel en stel automatisch een weekschema op. Interesse? Vraag een gratis intakegesprek aan!"
      - generic [ref=e96]:
        - button "Welke bedrijven hebben baat bij een samenwerking met HoneyLink?" [ref=e97]:
          - generic [ref=e98]: Welke bedrijven hebben baat bij een samenwerking met HoneyLink?
          - img [ref=e99]
        - region:
          - paragraph [ref=e101]: Elk bedrijf dat repetitieve processen wil automatiseren of slimmer wil werken met AI heeft baat bij HoneyLink. Denk aan MKB-bedrijven die hun administratie willen stroomlijnen, e-commerce bedrijven die hun klantenservice willen opschalen, of dienstverleners die hun offerteproces willen versnellen. Onze oplossingen zijn schaalbaar en worden op maat gemaakt voor jouw specifieke situatie.
      - generic [ref=e102]:
        - button "Wat kan ik verwachten van een adviesgesprek?" [ref=e103]:
          - generic [ref=e104]: Wat kan ik verwachten van een adviesgesprek?
          - img [ref=e105]
        - region:
          - paragraph [ref=e107]: In een vrijblijvend adviesgesprek van ongeveer 30 minuten bespreken we jouw huidige werkprocessen en identificeren we kansen voor automatisering. We kijken samen naar welke taken veel tijd kosten en hoe die efficienter kunnen. Na het gesprek ontvang je een concreet voorstel met mogelijke oplossingen en een indicatie van de investering.
      - generic [ref=e108]:
        - button "Hoe ziet de samenwerking eruit nadat ik klant ben geworden bij HoneyLink?" [ref=e109]:
          - generic [ref=e110]: Hoe ziet de samenwerking eruit nadat ik klant ben geworden bij HoneyLink?
          - img [ref=e111]
        - region:
          - paragraph [ref=e113]: Na het adviesgesprek stellen we een projectplan op met duidelijke mijlpalen en tijdlijn. Tijdens de implementatie houden we je wekelijks op de hoogte van de voortgang. Na oplevering bieden we ondersteuning en onderhoud zodat alles soepel blijft draaien. Onze kernwaarden zijn vlot, eenvoudig en resultaatgericht -- dat merk je in elke fase van de samenwerking.
      - generic [ref=e114]:
        - button "Wat is een workflow automation?" [ref=e115]:
          - generic [ref=e116]: Wat is een workflow automation?
          - img [ref=e117]
        - region:
          - paragraph [ref=e119]: Een workflow automation is het automatisch laten verlopen van een reeks stappen die normaal handmatig worden uitgevoerd. Denk aan het automatisch verwerken van inkomende e-mails, het aanmaken van taken in je projectmanagement tool, of het synchroniseren van data tussen verschillende systemen. Dit bespaart tijd, vermindert fouten en zorgt dat je team zich kan richten op werk dat er echt toe doet.
