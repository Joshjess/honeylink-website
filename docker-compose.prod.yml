services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ORIGIN=${ORIGIN:-https://honeylink.nl}
      - FORMSPREE_FORM_ID=${FORMSPREE_FORM_ID}
      - PROTOCOL_HEADER=x-forwarded-proto
      - HOST_HEADER=x-forwarded-host
    expose:
      - "3000"
    # Use 127.0.0.1 not localhost — alpine resolves localhost to ::1 first
    # while the server binds to 0.0.0.0 (IPv4), so IPv6 lookups refuse.
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3000/",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
